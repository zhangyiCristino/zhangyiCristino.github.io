      ["面向濺落後回收的決策校準神經算子預報（在投）", "Engineering Applications of AI · 在投", "張大朋, 張仡, S. Guo, Y. Li, K. Xie, Y. Jiang", "", ""],
    ],
    skills: ["MuJoCo", "Isaac Sim", "Python", "PyTorch", "神經算子", "PINN", "StarCCM+", "COMSOL", "Abaqus", "MATLAB", "LaTeX", "C++"],
    awards: [
      "第13屆全國海洋航行器設計與製作大賽 全國二等獎（2024）",
      "同賽事 華南賽區一等獎（2024）",
      "APMCM 亞太地區大學生數學建模競賽 三等獎（2025）",
      "校一等獎學金（2023）、二等獎學金（2025）",
      "船舶與海運學院 科創之星（2024、2026）",
    ],
  },
};

function render(lang) {
  const d = I18N[lang] || I18N.en;
  document.body.dataset.lang = lang;
  document.documentElement.lang = lang === "zh-tw" ? "zh-TW" : lang;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const k = el.dataset.i18n;
    if (d[k] !== undefined) el.innerHTML = d[k];
  });
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  document.getElementById("pubList").innerHTML = d.pubs.map(p => `
    <div class="pub">
      <div>${p[3] ? `<a href="${p[3]}">${esc(p[0])}</a>` : esc(p[0])}</div>
      <div class="venue">${esc(p[1])}</div>
      <div class="authors">${esc(p[2])}</div>
      ${p[4] ? `<div class="cites">${esc(p[4])}</div>` : ""}
    </div>`).join("");
  document.getElementById("skillList").innerHTML = d.skills.map(s => `<li>${esc(s)}</li>`).join("");
  document.getElementById("awardList").innerHTML = d.awards.map(a => `<li>${esc(a)}</li>`).join("");
  document.querySelectorAll("#langSwitch button").forEach(b =>
    b.classList.toggle("on", b.dataset.lang === lang));
  localStorage.setItem("lang", lang);
}

document.querySelectorAll("#langSwitch button").forEach(b =>
  b.addEventListener("click", () => render(b.dataset.lang)));

render(localStorage.getItem("lang") ||
  (navigator.language.startsWith("zh") ? (navigator.language === "zh-TW" || navigator.language === "zh-Hant" ? "zh-tw" : "zh") : "en"));
</script>
